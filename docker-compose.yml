services:
    postgres:
        image: postgres:16-alpine
        container_name: orthacms-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: orthacms
            POSTGRES_PASSWORD: orthacms
            POSTGRES_DB: orthacms
        ports:
            - '5432:5432'
        volumes:
            - orthacms-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U orthacms -d orthacms']
            interval: 5s
            timeout: 5s
            retries: 5

    # A real OpenID Connect provider to develop single sign-on against.
    #
    # Under the `sso` profile, so it does NOT start with `docker compose up -d`:
    # most work needs Postgres alone, and a second JVM is not something to hand
    # every contributor by default. Start it deliberately:
    #
    #     docker compose --profile sso up -d
    #
    # Then, in the admin console at http://localhost:8080 (admin/admin), create
    # a realm `orthacms`, a confidential client `orthacms` with the redirect URI
    # http://localhost:4200/api/auth/sso/keycloak/callback, and a user whose
    # email matches a seeded Ortha CMS account and is marked verified — the email
    # must be verified or the first sign-in is refused, by design.
    #
    # Then set, in `.env`:
    #     SSO_OIDC_ISSUER=http://localhost:8080/realms/orthacms
    #     SSO_OIDC_CLIENT_ID=orthacms
    #     SSO_OIDC_CLIENT_SECRET=<from the client's Credentials tab>
    #     SSO_OIDC_NAME=keycloak
    #     SSO_OIDC_LABEL=Keycloak
    #
    # `start-dev` serves plain HTTP, which the adapter allows for localhost
    # only — deliberately, since an identity token crossing the network in
    # clear text is exactly what the check exists to prevent.
    keycloak:
        image: quay.io/keycloak/keycloak:26.0
        container_name: orthacms-keycloak
        profiles: ['sso']
        restart: unless-stopped
        command: ['start-dev']
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_HTTP_PORT: '8080'
        ports:
            - '8080:8080'
        volumes:
            - orthacms-keycloak:/opt/keycloak/data

volumes:
    orthacms-pgdata:
    orthacms-keycloak:

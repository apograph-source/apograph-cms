# Postgres for local development. `docker compose up -d`, then `npm run migrate`.
services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: apograph
            POSTGRES_PASSWORD: apograph
            POSTGRES_DB: __DATABASE_NAME__
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U apograph']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres-data:
